<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Digital Locations</title>
    <link rel="stylesheet" crossorigin="anonymous" href="https://cdn.skypack.dev/lexgui/build/lexgui.css">
    <script type="importmap">
    {
        "imports": {
            "lexgui": "https://cdn.skypack.dev/lexgui/build/lexgui.module.js"
        }
    }
    </script>
</head>

<body>
    <div style="width:50%;font-size:36px;font-weight: 500;text-align: center;margin: 0 auto;margin-top: 25%;">Loading engine, please wait...</div>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1
        style="position:fixed;height:100%;width:100%;top:0%;left:0%;resize:both;"></canvas>
    <template id="main-script">
        {{{ SCRIPT }}}
    </template>
    <script type='text/javascript'>

        var Module = {
            preRun: [],
            postRun: [],
            onRuntimeInitialized: () => {
            },
            canvas: (function () {
                var canvas = document.getElementById('canvas');

                // Event handler to resize the canvas when the document view is changed
                window.addEventListener('resize', () => {
                    canvas.clientWidth = window.innerWidth;
                    canvas.clientHeight = window.innerHeight;
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                }, false);

                return canvas;
            })(),
            totalDependencies: 0
        };

        async function onEnginePreInitialized() {

            await Promise.resolve( Module.Engine.getInstance() ).then( result => {

                if ( !result ) {
                    console.error( "Module Instance is null" );
                }

                window.engineInstance = result;

            } ).catch( error => {
                console.log( error );
            });

            Promise.resolve( window.engineInstance.setWasmModuleInitialized(true) ).then( 

            ).catch( error => {
                console.log( error );
            });
        }

        function onEngineInitialized()
        {
            window.App.init()
        }

        function _processVector( vector )
        {
            var array = [];
            for( var i = 0; i < vector.size(); ++i )
                array.push( vector.get(i) );

            return array;
        }

        async function onglTFLoaded()
        {
            var cameraNamesVector = await Promise.resolve( window.engineInstance.getCamerasNames())

            // Update Camera look at points

            window.App.cameraNames = _processVector( cameraNamesVector );

            window.App.panel.get( "Look at" ).updateValues( window.App.cameraNames );

            if( window.App.cameraNames.length )
            {
                // window.App.lookAtCameraIndexFromName( window.App.cameraNames[ 0 ] );
                window.App.panel.get( "Look at" ).set(window.App.cameraNames[ 0 ])
            }
        }

        (async () => {
            // Custom for WebGPU
            if (!navigator.gpu) {
                console.error("Sorry, WebGPU is not supported by your browser.");
                const msg = document.createElement("div");
                Object.assign( msg.style, {
                    width: "50%",
                    fontSize: "36px",
                    fontWeight: "500",
                    textAlign: "center",
                    margin: "0 auto",
                    marginTop: "25%"
                } );
                msg.innerText = "Sorry, WebGPU is not supported by your browser.";
                document.body.appendChild(msg);
                return;
            } else {
                const jsTemplate = document.getElementById("main-script");
                const js = jsTemplate.content.cloneNode(true);
                document.body.appendChild(js);
            }
        })();
    </script>
    <script src=./js/zmq_bundle.js></script>
    <script type="module" src=./js/script.js></script>
</body>

</html>
